<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Reza CodingCamp</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    /* ===== DARK MODE ===== */
.dark {
  background-color: #1e1e2f;
  color: #f1f1f1;
  transition: background 0.3s, color 0.3s;
}

.dark .container {
  background-color: #2a2a3d;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

.dark h2, .dark h3 {
  color: #f1f1f1;
}

.dark input {
  background-color: #3a3a50;
  color: #fff;
  border: 1px solid #555;
}

.dark button {
  background-color: #4e8cff;
  color: #fff;
}

.dark button:hover {
  background-color: #3a6fcc;
}

.dark table {
  background-color: #1f1f2e;
  color: #f1f1f1;
}

.dark th {
  background-color: #4e8cff;
  color: #fff;
}

.dark td {
  color: #f1f1f1;
}

.dark tr:hover {
  background-color: #2f2f44;
}

.dark .delete {
  background-color: #e74c3c;
  color: #fff;
}

.dark .delete:hover {
  background-color: #c0392b;
}

.dark .chart-container {
  background-color: #1f1f2e;
  border-radius: 12px;
  padding: 10px;
}

input, button, table, .container, .chart-container {
  transition: all 0.3s ease;
}
  body {
    font-family: 'Roboto', sans-serif;
    margin: 0;
    padding: 0;
    background: #0054d3;
    color: #333;
  }

  h2 {
    text-align: center;
    margin-top: 20px;
    color: #2c3e50;
  }

  .container {
    max-width: 1000px;
    margin: 30px auto;
    background: #fff;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  }
  
  .form-input {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .form-input input {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
  }

  .form-input button {
    padding: 10px 20px;
    background: #2600ff;
    border: none;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
  }

  .form-input button:hover {
    background: #4c00ff;
  }

  .content {
    display: flex;
    gap: 25px;
    align-items: flex-start;
  }

  .table-container {
    flex: 3;
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  th, td {
    padding: 12px;
    text-align: center;
    border-bottom: 1px solid #e0e0e0;
  }

  th {
    background: #2f00ff;
    color: white;
    font-weight: 500;
  }

  tr:hover {
    background: #f1f7fc;
  }

  .delete {
    background: #810101;
    color: white;
    padding: 6px 12px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }

  .delete:hover {
    background: #ffffff;
  }

  .chart-container {
    flex: 2;
    max-width: 350px;
  }

  canvas {
    width: 100% !important;
    height: 300px !important;
  }

  h3 {
    margin-top: 15px;
    text-align: right;
  }
</style>
</head>
<body>

  <div class="container">
    <button onclick="toggleMode()" id="modeBtn">🌙 Dark Mode</button>
    <h2>Visualisator Pengeluaran 
    <h2>dan Anggaran</h2>
    <h5>Total Saldo: Rp <span id="totalHarga">0</span></h3>

  <div class="form-input">
    <input type="text" id="nama" placeholder="Nama Item">
    <input type="number" id="harga" placeholder="Harga">
    <input type="text" id="kategori" placeholder="Kategori (bebas)">
    <button onclick="tambahItem()">Tambah</button>
  </div>
<div style="margin-bottom:15px;">
  <button onclick="sortBy('harga')">Urutkan Harga ↑↓</button>
  <button onclick="sortBy('kategori')">Urutkan Kategori A-Z</button>
</div>
  <div class="content">
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Nama</th>
            <th>Harga</th>
            <th>Kategori</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="list"></tbody>
      </table>
    </div>

    <div class="chart-container">
      <canvas id="chart"></canvas>
    </div>
  </div>
</div>

<script>
    
if (localStorage.getItem("mode") === "dark") {
  document.body.classList.add("dark");
  document.getElementById("modeBtn").innerText = "☀️ Light Mode";
}

function toggleMode() {
  document.body.classList.toggle("dark");
  const btn = document.getElementById("modeBtn");

  const isDark = document.body.classList.contains("dark");
  btn.innerText = isDark ? "☀️ Light Mode" : "🌙 Dark Mode";
  
  localStorage.setItem("mode", isDark ? "dark" : "light");
}
  let data = [];
  let sortOrderHarga = 'asc'
  let sortOrderKategori = 'asc' 

  function sortBy(field) {
    if (field === 'harga') {
    data.sort((a, b) => {
      if (sortOrderHarga === 'asc') return a.harga - b.harga;
      else return b.harga - a.harga;
    });
    sortOrderHarga = sortOrderHarga === 'asc' ? 'desc' : 'asc';
  }

    if (field === 'kategori') {
    data.sort((a, b) => {
      if (sortOrderKategori === 'asc') return a.kategori.localeCompare(b.kategori);
      else return b.kategori.localeCompare(a.kategori);
    });
    sortOrderKategori = sortOrderKategori === 'asc' ? 'desc' : 'asc';
  }

  render()
}
  const colors = [
    "#ff6384", "#36a2eb", "#ffce56", "#4bc0c0",
    "#9966ff", "#ff9f40", "#e84393", "#00b894",
    "#fd79a8", "#6c5ce7"
  ];

  function tambahItem() {
    const nama = document.getElementById("nama").value.trim();
    const harga = Number(document.getElementById("harga").value);
    const kategori = document.getElementById("kategori").value.trim();

    if (!nama || !harga || !kategori) {
      alert("Isi semua field dengan benar!");
      return;
    }

    data.push({ nama, harga, kategori });

    document.getElementById("nama").value = "";
    document.getElementById("harga").value = "";
    document.getElementById("kategori").value = "";

    render();
  }

  function hapusItem(index) {
    data.splice(index, 1);
    render();
  }

  let chart;

  function render() {
    const list = document.getElementById("list");
    list.innerHTML = "";

    data.forEach((item, index) => {
      list.innerHTML += `
        <tr>
          <td>${item.nama}</td>
          <td>${item.harga.toLocaleString("id-ID")}</td>
          <td>${item.kategori}</td>
          <td><button class="delete" onclick="hapusItem(${index})">Hapus</button></td>
        </tr>
      `;
    });

    const total = data.reduce((sum, item) => sum + item.harga, 0);
    document.getElementById("totalHarga").innerText = total.toLocaleString("id-ID");

    const kategoriTotal = {};
    data.forEach(item => {
      if (!kategoriTotal[item.kategori]) kategoriTotal[item.kategori] = 0;
      kategoriTotal[item.kategori] += item.harga;
    });

    const labels = Object.keys(kategoriTotal);
    const values = Object.values(kategoriTotal);

    if (chart) chart.destroy();

    const ctx = document.getElementById("chart").getContext("2d");
    chart = new Chart(ctx, {
      type: "doughnut",
      data: {
        labels: labels,
        datasets: [{
          data: values,
          backgroundColor: colors.slice(0, labels.length)
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: {
            position: "bottom",
            labels: { color: "#2c3e50" }
          }
        }
      }
    });
  }

  render();
</script>

</body>
</html>
